services:
  frontend:
    build: ./frontend
    container_name: buildwise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build: .
    container_name: buildwise-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise}@postgres:5432/${POSTGRES_DB:-buildwise}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-buildwise-dev-secret-change-me}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bootstrap:
    build: .
    container_name: buildwise-bootstrap
    profiles: ["ops"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise}@postgres:5432/${POSTGRES_DB:-buildwise}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-buildwise-dev-secret-change-me}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python -m app.operations.bootstrap.seed &&
      python -m app.operations.bootstrap.import_cemento_canonico &&
      python -m app.operations.bootstrap.import_pastina &&
      python -m app.operations.bootstrap.import_membrana_megaflex &&
      python -m app.operations.bootstrap.import_external_indices_snapshot &&
      python -m app.operations.bootstrap.validate_minimum_dataset"

  postgres:
    image: postgres:16-alpine
    container_name: buildwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildwise}
      POSTGRES_USER: ${POSTGRES_USER:-buildwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildwise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

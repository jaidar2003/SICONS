services:
  api:
    build: .
    container_name: sicons-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sicons}:${POSTGRES_PASSWORD:-sicons}@postgres:5432/${POSTGRES_DB:-sicons}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python -m app.db.seed &&
      python -m app.db.import_cemento_facturas &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  postgres:
    image: postgres:16-alpine
    container_name: sicons-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sicons}
      POSTGRES_USER: ${POSTGRES_USER:-sicons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicons}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "frontend",
    "tmp",
    "backups",
    "app/experiments",
    "app/experiment_*.py",
    "app/train_prophet_cemento.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

services:
  caddy:
    image: caddy:2-alpine
    container_name: buildwise-caddy
    restart: unless-stopped
    env_file:
      - path: .env.openstack
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/openstack/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: .
    container_name: buildwise-api
    restart: unless-stopped
    env_file:
      - path: .env.openstack
        required: false
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise}@postgres:5432/${POSTGRES_DB:-buildwise}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bootstrap:
    build: .
    container_name: buildwise-bootstrap
    profiles: ["ops"]
    env_file:
      - path: .env.openstack
        required: false
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise}@postgres:5432/${POSTGRES_DB:-buildwise}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python -m app.operations.bootstrap.seed &&
      python -m app.operations.bootstrap.import_cemento_canonico &&
      python -m app.operations.bootstrap.import_pastina &&
      python -m app.operations.bootstrap.import_membrana_megaflex &&
      python -m app.operations.bootstrap.import_external_indices_snapshot &&
      python -m app.operations.bootstrap.validate_minimum_dataset"

  postgres:
    image: postgres:16-alpine
    container_name: buildwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildwise}
      POSTGRES_USER: ${POSTGRES_USER:-buildwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildwise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: buildwise-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

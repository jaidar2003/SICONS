[pytest]
testpaths = tests
pythonpath = .
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=90
markers =
    integration: requires a migrated PostgreSQL database
    smoke: exercises a running API deployment
    chat_evaluation: runs the deterministic canonical conversational evaluation
    external_evaluation: requires an explicitly configured external LLM provider

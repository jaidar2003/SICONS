name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_NAME: ghcr.io/juanmanuelaidar/buildwise-api
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    needs: build-image
    runs-on: [self-hosted, linux, x64, buildwise-production]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy validated main revision
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BACKEND_IMAGE: ghcr.io/juanmanuelaidar/buildwise-api:${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/BuildWise
          git fetch origin main
          git switch main
          git pull --ff-only origin main

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$DEPLOY_SHA" ]; then
            echo "Refusing to deploy $actual_sha: CI validated $DEPLOY_SHA" >&2
            exit 1
          fi

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack pull api
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack up -d --no-build --wait --wait-timeout 300
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack ps
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack exec -T api \
            python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10))['status'] == 'ok'"

      - name: Show service logs after failure
        if: failure()
        run: |
          cd /home/ubuntu/BuildWise
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack ps || true
          docker compose -f docker-compose.openstack.yml --env-file .env.openstack logs --no-color --tail=150 api caddy || true
